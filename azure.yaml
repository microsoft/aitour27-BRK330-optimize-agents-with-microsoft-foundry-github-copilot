# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: brk330-contoso-travel
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4
        model:
          format: OpenAI
          name: gpt-5.4
          version: '2026-03-05'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 200
  contoso-travel:
    host: azure.ai.agent
    project: src/agent
    language: python
    hooks:
      prepackage:
        posix:
          shell: sh
          run: |
            set -eu
            rm -rf fixtures
            cp -R ../../data/fixtures fixtures
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: contoso-travel
    displayName: Contoso Travel Concierge
    description: Deterministic policy-aware travel concierge for fictional Caldova.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      CONTOSO_CONFIGURATION: ${CONTOSO_CONFIGURATION}
      CONTOSO_INSTRUCTION_SHA: ${CONTOSO_INSTRUCTION_SHA}
      OPTIMIZATION_CANDIDATE_ID: ${CONTOSO_CONFIGURATION}
      OPTIMIZATION_LOCAL_DIR: .agent_configs
    metadata:
      tags:
        - BRK330
        - Agent Framework
        - Hosted Agent
        - Responses Protocol
        - Agent Optimization
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  web:
    host: containerapp
    project: src/web
    language: python
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    env:
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      AZURE_CLIENT_ID: ${WEB_MANAGED_IDENTITY_CLIENT_ID}
      CONTOSO_AGENT_NAME: contoso-travel
      CONTOSO_CONFIGURATION: ${CONTOSO_CONFIGURATION}
      CONTOSO_FIXTURES_DIR: /app/data/fixtures
      CONTOSO_INSTRUCTION_SHA: ${CONTOSO_INSTRUCTION_SHA}
      CONTOSO_MODEL_DEPLOYMENT: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
infra:
  provider: microsoft.foundry
