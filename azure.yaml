# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: brk330-concierge
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5
                version: "2025-08-07"
              name: gpt-5
              sku:
                capacity: 500
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-4.1
                version: "2025-04-14"
              name: gpt-4.1
              sku:
                capacity: 500
                name: GlobalStandard
            - model:
                format: OpenAI
                name: model-router
                version: "2025-11-18"
              name: model-router
              sku:
                capacity: 500
                name: GlobalStandard
    contoso-travel:
        project: src/agent
        host: azure.ai.agent
        language: python
        hooks:
            prepackage:
                posix:
                    shell: sh
                    run: |
                        # Mirror data/ fixtures into src/agent/fixtures/ so the
                        # container has them at /app/fixtures/.
                        cd ../..
                        mkdir -p src/agent/fixtures
                        rsync -a --delete data/ src/agent/fixtures/
                        echo "prepackage: fixtures synced to src/agent/fixtures/"
        uses:
            - ai-project
        env:
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            AZURE_AI_JUDGE_DEPLOYMENT_NAME: gpt-4.1
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AZURE_AI_PLANNER_DEPLOYMENT_NAME: gpt-5
            AZURE_AI_ROUTER_DEPLOYMENT_NAME: model-router
            CONTOSO_ROUTED: ${CONTOSO_ROUTED=false}
            CONTOSO_VARIANT: ${CONTOSO_VARIANT=baseline}
            OPTIMIZATION_CANDIDATE_ID: cand_opt_dde9f3d1d619476bbea0b393b458c9e9_0005
            OPTIMIZATION_LOCAL_DIR: .agent_configs
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Contoso Travel Concierge for Caldova (fictional pharma). Plans
            compliant business travel and reconciles receipts. Policy is a
            HARD GATE: refuse and cite CT-nn verbatim on violations. Decompose
            compound requests, use only fixture tools (search_flights,
            search_hotels, search_car_rentals, check_travel_policy,
            extract_receipt, prepare_itinerary, submit_booking); never
            fabricate options or receipts. Output: tasks, tool timeline,
            policy decisions, itinerary.
        kind: hosted
        metadata:
            tags:
                - BRK330
                - Contoso Travel Concierge
                - Baseline
                - Responses Protocol
        name: contoso-travel
        protocols:
            - protocol: responses
              version: 2.0.0
    web:
        project: src/web
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            context: ../..
            remoteBuild: true
        env:
            AGENT_CONTOSO_TRAVEL_RESPONSES_ENDPOINT: ${AGENT_CONTOSO_TRAVEL_RESPONSES_ENDPOINT}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
            AZURE_CLIENT_ID: ${WEB_MANAGED_IDENTITY_CLIENT_ID}
            CONTOSO_MODEL_DEPLOYMENT: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            CONTOSO_VARIANT: baseline
infra:
    provider: microsoft.foundry
hooks:
    postprovision:
        posix:
            shell: sh
            run: |
                set -e
                echo "postprovision: deploying supplemental resources (App Insights, RBAC, Container Apps)"
                RG="$(azd env get-value AZURE_RESOURCE_GROUP)"
                ENV_NAME="$(azd env get-value AZURE_ENV_NAME)"
                ACCT="$(azd env get-value AZURE_AI_ACCOUNT_NAME)"
                PROJECT="$(azd env get-value AZURE_AI_PROJECT_NAME)"
                PRINCIPAL="$(azd env get-value AZURE_PRINCIPAL_ID || true)"

                OUT=$(az deployment group create \
                    --resource-group "$RG" \
                    --template-file infra/supplemental.bicep \
                    --name "brk330-supplemental-$(date +%s)" \
                    --parameters foundryAccountName="$ACCT" projectName="$PROJECT" environmentName="$ENV_NAME" principalId="$PRINCIPAL" \
                    --query "properties.outputs" -o json)

                AI_CONN=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['APPLICATIONINSIGHTS_CONNECTION_STRING']['value'])")
                AI_NAME=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['AZURE_MONITOR_APP_INSIGHTS_NAME']['value'])")
                ACR_NAME=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['AZURE_CONTAINER_REGISTRY_NAME']['value'])")
                ACR_ENDPOINT=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['AZURE_CONTAINER_REGISTRY_ENDPOINT']['value'])")
                WEB_URL=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['WEB_URL']['value'])")
                WEB_MI_ID=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['WEB_MANAGED_IDENTITY_CLIENT_ID']['value'])")

                azd env set APPLICATIONINSIGHTS_CONNECTION_STRING "$AI_CONN"
                azd env set AZURE_MONITOR_APP_INSIGHTS_NAME "$AI_NAME"
                azd env set AZURE_CONTAINER_REGISTRY_NAME "$ACR_NAME"
                azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR_ENDPOINT"
                azd env set WEB_URL "$WEB_URL"
                azd env set WEB_MANAGED_IDENTITY_CLIENT_ID "$WEB_MI_ID"

                # Default the concierge to gpt-5 unless the user overrides.
                if [ -z "$(azd env get-value AZURE_AI_MODEL_DEPLOYMENT_NAME || true)" ]; then
                    azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME gpt-5
                fi
                echo "postprovision: done. Web URL: $WEB_URL"
