# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: brk330-contoso-travel
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4
                version: "2026-03-05"
              name: gpt-5.4
              sku:
                capacity: 200
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 200
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-4.1-mini
                version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 100
                name: GlobalStandard
    contoso-travel:
        project: src/agent
        host: azure.ai.agent
        language: python
        hooks:
            prepackage:
                posix:
                    shell: sh
                    run: |
                        set -eu
                        rm -rf fixtures
                        cp -R ../../data/fixtures fixtures
        uses:
            - ai-project
        env:
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            CONTOSO_CONFIGURATION: ${CONTOSO_CONFIGURATION}
            CONTOSO_INSTRUCTION_SHA: ${CONTOSO_INSTRUCTION_SHA}
            OPTIMIZATION_CANDIDATE_ID: cand_opt_86d7c7531b21417ab4581f1266ea4c24_0002
            OPTIMIZATION_LOCAL_DIR: .agent_configs
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Deterministic policy-aware travel concierge for fictional Caldova.
        displayName: Contoso Travel Concierge
        kind: hosted
        metadata:
            tags:
                - BRK330
                - Agent Framework
                - Hosted Agent
                - Responses Protocol
                - Agent Optimization
        name: contoso-travel
        protocols:
            - protocol: responses
              version: 2.0.0
    web:
        project: src/web
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            context: ../..
            remoteBuild: true
        env:
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            AZURE_CLIENT_ID: ${WEB_MANAGED_IDENTITY_CLIENT_ID}
            CONTOSO_AGENT_NAME: contoso-travel
            CONTOSO_CONFIGURATION: ${CONTOSO_CONFIGURATION}
            CONTOSO_FIXTURES_DIR: /app/data/fixtures
            CONTOSO_INSTRUCTION_SHA: ${CONTOSO_INSTRUCTION_SHA}
            CONTOSO_MODEL_DEPLOYMENT: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry
